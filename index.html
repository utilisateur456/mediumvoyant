function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrObj, val) => {
    const edits = (typeof keyOrObj === 'object' && keyOrObj !== null) ? keyOrObj : { [keyOrObj]: val };
    setValues(prev => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return { tweaks: values, setTweak };
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  React.useEffect(() => {
    const fn = e => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', fn);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', fn);
  }, []);
  const close = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  if (!open) return null;
  return (
    <>
      <style>{TWEAKS_CSS}</style>
      <div className="twk-panel">
        <div className="twk-hd"><b>{title}</b><button className="twk-x" onClick={close}>✕</button></div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ title, children }) {
  return <><div className="twk-sect">{title}</div>{children}</>;
}

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  return (
    <div className="twk-row">
      <div className="twk-lbl">{label}</div>
      <div className="twk-seg">
        <div className="twk-seg-thumb" style={{ left:`calc(2px + ${idx}*(100% - 4px)/${n})`, width:`calc((100% - 4px)/${n})` }} />
        {opts.map(o => <button key={o.value} type="button" onClick={() => onChange(o.value)}>{o.label}</button>)}
      </div>
    </div>
  );
}

// APP

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"theme":"sombre"}/*EDITMODE-END*/;

const App = () => {
  const { tweaks, setTweak } = useTweaks(TWEAK_DEFAULTS);
  const t = THEMES[tweaks.theme] || THEMES.sombre;

  const [activeSection, setActiveSection] = React.useState('accueil');
  React.useEffect(() => {
    const ids = ['accueil','apropos','methodes','comment','temoignages','faq','contact'];
    const obs = ids.map(id => {
      const el = document.getElementById(id);
      if (!el) return null;
      const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) setActiveSection(id); }, { rootMargin:'-40% 0px -55% 0px' });
      o.observe(el); return o;
    });
    return () => obs.forEach(o => o?.disconnect());
  }, []);

  React.useEffect(() => {
    document.body.style.background = t.bgPage;
    document.body.style.color = t.textPrimary;
  }, [t]);

  return (
    <React.Fragment>
      <AppHeader t={t} activeSection={activeSection} />
      <main>
        <AppHero t={t} />
        <AppAbout t={t} />
        <AppHowItWorks t={t} />
        <AppMethodes t={t} />
        <AppTestimonials t={t} />
        <AppFAQ t={t} />
        <AppContact t={t} />
      </main>
      <AppFooter t={t} />
      <FloatingCall t={t} />
      <TweaksPanel title="Apparence">
        <TweakSection title="Ambiance">
          <TweakRadio label="Thème" value={tweaks.theme} onChange={v => setTweak('theme', v)}
            options={[{value:'clair',label:'Clair'},{value:'doux',label:'Doux'},{value:'sombre',label:'Sombre'}]} />
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrObj, val) => {
    const edits = (typeof keyOrObj === 'object' && keyOrObj !== null) ? keyOrObj : { [keyOrObj]: val };
    setValues(prev => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return { tweaks: values, setTweak };
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  React.useEffect(() => {
    const fn = e => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', fn);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', fn);
  }, []);
  const close = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  if (!open) return null;
  return (
    <>
      <style>{TWEAKS_CSS}</style>
      <div className="twk-panel">
        <div className="twk-hd"><b>{title}</b><button className="twk-x" onClick={close}>✕</button></div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ title, children }) {
  return <><div className="twk-sect">{title}</div>{children}</>;
}

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  return (
    <div className="twk-row">
      <div className="twk-lbl">{label}</div>
      <div className="twk-seg">
        <div className="twk-seg-thumb" style={{ left:`calc(2px + ${idx}*(100% - 4px)/${n})`, width:`calc((100% - 4px)/${n})` }} />
        {opts.map(o => <button key={o.value} type="button" onClick={() => onChange(o.value)}>{o.label}</button>)}
      </div>
    </div>
  );
}

function BookingForm({ t }) {
  const formRef = React.useRef(null);
  const [focused, setFocused] = React.useState('');
  const [status, setStatus] = React.useState('idle');

  const handleSubmit = e => {
    e.preventDefault();
    if (status === 'sending') return;
    setStatus('sending');
    emailjs.sendForm(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, formRef.current)
      .then(() => {
        setStatus('success');
        formRef.current.reset();
      })
      .catch(() => {
        setStatus('error');
      });
  };

  const focusProps = key => ({
    onFocus: () => setFocused(key),
    onBlur:  () => setFocused(''),
    style: inputStyle(t, focused === key),
  });

  if (status === 'success') {
    return (
      <div style={{ textAlign:'center', padding:'40px 20px' }}>
        <div style={{ color: t.accent, fontSize:'28px', marginBottom:'14px' }}>◆</div>
        <div style={{ fontFamily:"'Playfair Display',serif", fontSize:'22px', fontWeight:300, color: t.textPrimary, marginBottom:'10px' }}>
          Demande envoyée
        </div>
        <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:'13px', color: t.textSecondary, lineHeight:1.7 }}>
          Je reviens vers toi très bientôt au numéro indiqué.
        </p>
        <button onClick={() => setStatus('idle')} style={{ marginTop:'20px', background:'none', border:`1px solid ${t.border}`, borderRadius:'3px', padding:'9px 22px', color: t.textMuted, fontFamily:"'Josefin Sans',sans-serif", fontSize:'8px', letterSpacing:'0.14em', textTransform:'uppercase', cursor:'pointer' }}>
          Nouvelle demande
        </button>
      </div>
    );
  }

  return (
    <form ref={formRef} onSubmit={handleSubmit} noValidate style={{ display:'flex', flexDirection:'column', gap:'16px' }}>
      {/* Prénom */}
      <div>
        <label style={labelStyle(t)}>Prénom *</label>
        <input name="from_name" type="text" required placeholder="Marie" {...focusProps('prenom')} />
      </div>

      {/* Téléphone */}
      <div>
        <label style={labelStyle(t)}>Téléphone *</label>
        <input name="phone" type="tel" required placeholder="+41 79 000 00 00" {...focusProps('telephone')} />
      </div>

      {/* Date + Heure */}
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px' }}>
        <div>
          <label style={labelStyle(t)}>Date souhaitée *</label>
          <input name="appointment_date" type="date" required min={new Date().toISOString().split('T')[0]} {...focusProps('date')} />
        </div>
        <div>
          <label style={labelStyle(t)}>Heure souhaitée *</label>
          <input name="appointment_time" type="time" required min="08:00" max="22:00" {...focusProps('heure')} />
        </div>
      </div>

      {/* Type de consultation */}
      <div>
        <label style={labelStyle(t)}>Type de consultation *</label>
        <select name="consultation_type" required onFocus={() => setFocused('type')} onBlur={() => setFocused('')}
          style={{ ...inputStyle(t, focused === 'type'), cursor:'pointer', color: t.textPrimary }}>
          <option value="" disabled>Choisir une méthode…</option>
          {CONSULTATION_TYPES.map(c => <option key={c} value={c} style={{ background: t.bgCard, color: t.textPrimary }}>{c}</option>)}
        </select>
      </div>

      {status === 'error' && (
        <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:'12px', color:'oklch(55% 0.18 25)', textAlign:'center' }}>
          Une erreur s'est produite. Réessaie ou appelle directement le 0901 212 212.
        </p>
      )}

      <button type="submit" disabled={status === 'sending'} style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:'9px', fontFamily:"'Josefin Sans',sans-serif", fontSize:'10px', fontWeight:500, letterSpacing:'0.18em', textTransform:'uppercase', color: t.accentText, background: t.accent, border:'none', borderRadius:'3px', padding:'14px 28px', cursor: status === 'sending' ? 'wait' : 'pointer', opacity: status === 'sending' ? 0.7 : 1, transition:'opacity 200ms' }}>
        {status === 'sending' ? 'Envoi en cours…' : (
          <>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Envoyer la demande
          </>
        )}
      </button>
    </form>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"theme":"clair"}/*EDITMODE-END*/;

const App = () => {
  const { tweaks, setTweak } = useTweaks(TWEAK_DEFAULTS);
  const t = THEMES[tweaks.theme] || THEMES.sombre;

  const [activeSection, setActiveSection] = React.useState('accueil');
  React.useEffect(() => {
    const ids = ['accueil','apropos','methodes','comment','temoignages','faq','contact'];
    const obs = ids.map(id => {
      const el = document.getElementById(id);
      if (!el) return null;
      const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) setActiveSection(id); }, { rootMargin:'-40% 0px -55% 0px' });
      o.observe(el); return o;
    });
    return () => obs.forEach(o => o?.disconnect());
  }, []);

  React.useEffect(() => {
    document.body.style.background = t.bgPage;
    document.body.style.color = t.textPrimary;
  }, [t]);

  return (
    <React.Fragment>
      <AppHeader t={t} activeSection={activeSection} />
      <main>
        <AppHero t={t} />
        <AppAbout t={t} />
        <AppHowItWorks t={t} />
        <AppMethodes t={t} />
        <AppTestimonials t={t} />
        <AppFAQ t={t} />
        <AppContact t={t} />
      </main>
      <AppFooter t={t} />
      <FloatingCall t={t} />
      <TweaksPanel title="Apparence">
        <TweakSection title="Ambiance">
          <TweakRadio label="Thème" value={tweaks.theme} onChange={v => setTweak('theme', v)}
            options={[{value:'clair',label:'Clair'},{value:'doux',label:'Doux'},{value:'sombre',label:'Sombre'}]} />
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
